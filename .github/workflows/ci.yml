name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src, rustfmt, clippy
          targets: x86_64-unknown-none,x86_64-unknown-uefi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 llvm lld python3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Build bootloader artifact
        run: cargo build --package indo-boot --target x86_64-unknown-uefi

      - name: Build kernel artifact
        run: cargo build --package indo-kernel --target x86_64-unknown-none

      - name: Verify workflow scaffolding
        run: python tools/verify_windows_build.py

      - name: Run smoke verification
        run: powershell -File build.ps1 smoke
